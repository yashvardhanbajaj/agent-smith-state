name: tests

# Per-run state commits (runs/, state.json, proposals.json ...) carry no code change; running CI
# on them only produced noise and trained everyone to ignore a red badge.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "skill/**"
      - ".github/**"
      - "requirements*.txt"
      - "pytest.ini"
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -v

      - name: Run golden-master regression checks
        run: |
          ./tests/verify_triggers.sh
          ./tests/verify_triggers_ladder.sh
          ./tests/verify_ladder.sh
          ./tests/verify_proposals.sh
          ./tests/verify_dashboard.sh
